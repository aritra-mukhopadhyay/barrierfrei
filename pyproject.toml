[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "barrierfrei"
version = "0.1.0"
description = "Step-free route agent: street photos + OpenStreetMap + live elevator status, fused by Meta models"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40,<4",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "pydantic-settings>=2.4,<3",
    "osmnx>=2.0,<3",
    "pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["barrierfrei*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # ruff format owns line length

[tool.pytest.ini_options]
testpaths = ["tests"]
